name = "ailegalpractice-com-v1"
main = "src/worker.ts"
compatibility_date = "2026-06-25"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ailegalpractice.com"
custom_domain = true

[[routes]]
pattern = "www.ailegalpractice.com"
